<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minha Landing Page</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#ff758c,#ff7eb3);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:80%;
    max-width:900px;
    display:flex;
    align-items:center;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    overflow:hidden;
}

.imagem{
    width:50%;
}

.imagem img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.texto{
    padding:40px;
    width:50%;
}

.texto h1{
    margin-top:0;
    font-size:32px;
}

.texto p{
    color:#555;
}

button{
    padding:12px 25px;
    border:none;
    background:#ff4f81;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#e8436f;
}

</style>
</head>

<body>

<div class="container">

<div class="imagem">
<img src="ddddd.jpg" alt="foto especial">
</div>

<div class="texto">
<h1>Para alguém especial ❤️</h1>

<p>
Essa é uma pequena página que fiz só para você.
Cada linha de código tem um pouco do meu carinho.
</p>

<button>Te amo</button>

</div>

</div>

</body>
</html>
